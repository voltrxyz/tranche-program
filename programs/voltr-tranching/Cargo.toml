[package]
name = "voltr-tranching"
version = "0.1.0"
description = "Voltr Tranching Program — two-tranche (Senior/Junior) yield structure on top of Voltr Vaults"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "voltr_tranching"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
voltr-vault = { git = "https://github.com/voltrxyz/vault-program.git", rev = "908399ada636e74a97dcd7b9de5e34504441672e", package = "voltr-vault", features = ["cpi"] }
